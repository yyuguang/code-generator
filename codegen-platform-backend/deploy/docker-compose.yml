version: "3.9"
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ai_codegen_platform
    ports:
      - "3306:3306"
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    depends_on:
      - mysql
    ports:
      - "8080:8080"
